{
  "name": "Validate SDK deposit simulation fixtures",
  "on": {
    "push": {
      "branches": [
        "validate/1557-sdk-deposit-fixtures"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "sdk": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 15,
      "defaults": {
        "run": {
          "working-directory": "packages/sdk"
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v4"
        },
        {
          "uses": "actions/setup-node@v4",
          "with": {
            "node-version": "20"
          }
        },
        {
          "name": "Install audited SDK dependencies without lifecycle scripts",
          "run": "npm ci --ignore-scripts"
        },
        {
          "name": "SDK tests",
          "run": "npm test"
        },
        {
          "name": "Fixture type compatibility",
          "if": "always()",
          "run": "npx tsc --noEmit --target ES2020 --module ESNext --moduleResolution bundler --skipLibCheck --strict test/depositSimulation.test.ts"
        },
        {
          "name": "SDK typecheck",
          "if": "always()",
          "run": "npm run typecheck"
        },
        {
          "name": "SDK build",
          "if": "always()",
          "run": "npm run build"
        }
      ]
    }
  }
}
